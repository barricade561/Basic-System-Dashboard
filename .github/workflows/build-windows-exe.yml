name: Build Windows EXE

on:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/build-windows-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller --noconsole --onefile --name SystemResourceWidget main.py

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: SystemResourceWidget-Windows
          path: dist/SystemResourceWidget.exe

      - name: Copy executable into repository release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/SystemResourceWidget.exe release/SystemResourceWidget.exe -Force

      - name: Commit executable
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/SystemResourceWidget.exe
          if (git diff --cached --quiet) {
            Write-Host "Executable is unchanged."
            exit 0
          }
          git commit -m "Build Windows executable"
          git push
